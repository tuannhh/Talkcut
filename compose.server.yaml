# Server edition: one shared Talkcut for a team on a CPU-only server, accounts
# issued by an administrator, a reverse proxy (HTTPS) in front.
#
#   docker compose -f compose.yaml -f compose.server.yaml up -d --build
#
# Every value below can be changed in .env without editing this file. The
# defaults suit about 16 vCPU / 32 GB RAM with 4-5 people working at once;
# DEPLOY.md explains the sizing and the reverse proxy.
services:
  studio:
    environment:
      TALKCUT_AUTH: "on"
      # Public address(es) of the site, e.g. https://talkcut.misa.local
      TALKCUT_ALLOWED_ORIGINS: ${TALKCUT_ALLOWED_ORIGINS:-}
      TALKCUT_COOKIE_SECURE: ${TALKCUT_COOKIE_SECURE:-auto}
      # The port is published on 127.0.0.1 only, so the reverse proxy on this
      # host is the only client; it must overwrite X-Forwarded-For.
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-*}
      RENDER_ACCEL: cpu
      RENDER_PRESET: ${RENDER_PRESET:-veryfast}
      RENDER_THREADS: ${RENDER_THREADS:-6}
      RENDER_WORKERS: ${RENDER_WORKERS:-2}
      FRAMING_WORKERS: ${FRAMING_WORKERS:-2}
      INGEST_WORKERS: ${INGEST_WORKERS:-1}
      AI_WORKERS: ${AI_WORKERS:-2}
      STT_PARALLEL: ${STT_PARALLEL:-4}
      PREVIEW_PROXY: ${PREVIEW_PROXY:-auto}
      PREPARE_FRAMING_TOP: ${PREPARE_FRAMING_TOP:-6}
    # DATA_PATH: a folder on the large disk (owned by uid 10001) instead of
    # the Docker volume; both services must see the same /data.
    volumes:
      - ${DATA_PATH:-studio-data}:/data
    shm_size: 1gb
    mem_limit: ${STUDIO_MEMORY:-20g}
  face-engine:
    environment:
      FACE_ENGINE_ACCEL: cpu
      FACE_ENGINE_WORKERS: ${FACE_ENGINE_WORKERS:-3}
    volumes:
      - ${DATA_PATH:-studio-data}:/data
    mem_limit: ${FACE_ENGINE_MEMORY:-6g}
